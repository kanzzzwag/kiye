name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      API_KEY: ci-test-key-0123456789abcdef
      DATABASE_URL: sqlite:///./data/test.db
      QUEUE_MODE: thread
      SEED_DEMO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - name: Install (CPU torch)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt pytest httpx
      - name: Unit and contract tests (rules on synthetic events, response schema)
        working-directory: backend
        run: python -m pytest -q tests

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit
      - name: Audit pinned dependencies
        run: pip-audit -r backend/requirements.txt --progress-spinner off

  jury-check:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for CI
        run: |
          echo "API_KEY=ci-jury-key-$(openssl rand -hex 16)" > .env
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Synthetic clips (no real footage in the repo)
        run: |
          pip install httpx opencv-python-headless==4.10.0.84 numpy
          python scripts/make_synthetic.py /tmp/clips 3
      - name: jury_check.py on 3 clips
        run: |
          KEY=$(grep ^API_KEY= .env | cut -d= -f2)
          for f in /tmp/clips/*.mov; do python scripts/jury_check.py http://localhost:8000 "$KEY" "$f"; done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
