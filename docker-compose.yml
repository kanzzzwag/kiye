services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forte
      POSTGRES_USER: forte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U forte"], interval: 5s, retries: 10}
  redis:
    image: redis:7-alpine
  api:
    build: {context: ./backend, additional_contexts: {frontend: ./frontend}}
    env_file: .env
    environment: &env
      DATABASE_URL: postgresql+psycopg2://forte:${POSTGRES_PASSWORD}@db:5432/forte
      REDIS_URL: redis://redis:6379/0
      QUEUE_MODE: rq
      STORAGE_DIR: /srv/data/storage
    volumes: [storage:/srv/data]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
    ports: ["8000:8000"]
  worker:
    build: {context: ./backend, additional_contexts: {frontend: ./frontend}}
    env_file: .env
    environment: *env
    command: ["rq", "worker", "analyze", "--url", "redis://redis:6379/0"]
    volumes: [storage:/srv/data]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
volumes:
  pgdata:
  storage:
